<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pollutant Field</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Sort and filter">
    <header class="masthead">
      <h1>Pollutant Field</h1>
    </header>

    <section class="group">
      <h2>Arrange by</h2>
      <div class="seg" role="radiogroup" id="views"></div>
      <div class="threshold" id="thresholdWrap" hidden>
        <label for="threshold">Count as removed at <output id="thresholdOut">70</output>% or more</label>
        <input type="range" id="threshold" min="10" max="99" value="70">
      </div>
    </section>

    <section class="group">
      <h2>Pollutant <span class="hint">shape</span></h2>
      <div id="families"></div>
    </section>

    <section class="group">
      <h2>Treatment <span class="hint">color</span></h2>
      <div class="chips" id="treatments"></div>
    </section>

    <section class="group">
      <h2>Scale</h2>
      <div class="chips" id="scales"></div>
    </section>

    <section class="group">
      <label class="search">
        <span>Find a pollutant</span>
        <input type="search" id="search" placeholder="arsenic, PFAS, ammonia" autocomplete="off">
      </label>
    </section>
  </aside>

  <main class="field" id="field">
    <div class="scroller" id="scroller">
      <canvas id="canvas" aria-label="Pollutant and treatment field" role="img"></canvas>
      <div class="tip" id="tip" hidden></div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
  </main>

  <aside class="drawer" id="drawer" aria-label="Details" hidden>
    <button class="close" id="close" aria-label="Close details">Close</button>
    <div id="drawerBody"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
